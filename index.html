<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>물류 발주서 정규화 & 송장 압축 엔진</title>
    <!-- SheetJS 엑셀 파싱 및 생성 라이브러리 (다중 CDN 페일오버) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        if (typeof XLSX === 'undefined') {
            document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>');
        }
    </script>
    <style>
        :root {
            --primary: #27ae60;
            --primary-hover: #219150;
            --secondary: #2980b9;
            --secondary-hover: #1f618d;
            --dark: #2c3e50;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --border: #dcdde1;
        }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif; background-color: var(--bg); margin: 0; padding: 20px 15px; color: #333; line-height: 1.5; }
        .container { max-width: 980px; margin: 0 auto; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 25px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 12px; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 20px; color: var(--dark); font-weight: 700; }
        .badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: bold; background: #e8f8f5; color: var(--primary); border: 1px solid #a3e4d7; }

        /* 모바일 / PC 네이티브 라벨형 드롭존 */
        .dropzone-label {
            display: block; width: 100%; padding: 35px 20px; border: 2px dashed var(--secondary); border-radius: 10px;
            background: #f8fbfe; text-align: center; cursor: pointer; transition: all 0.2s ease; user-select: none;
        }
        .dropzone-label:hover { background: #eaf4fd; border-color: var(--primary); }
        .dropzone-label.dragover { background: #d5e8f8; border-color: var(--primary); border-style: solid; }
        .dropzone-label p { margin: 0 0 6px 0; font-size: 16px; font-weight: bold; color: var(--secondary); }
        .dropzone-label span { font-size: 13px; color: #7f8c8d; }

        .file-box { margin-top: 15px; border: 1px solid var(--border); border-radius: 8px; padding: 12px; background: #fafafa; }
        .file-summary { font-size: 13px; font-weight: bold; margin-bottom: 8px; color: var(--dark); display: flex; justify-content: space-between; }
        .file-list { max-height: 140px; overflow-y: auto; font-size: 12px; font-family: Consolas, monospace; line-height: 1.6; }
        .file-item { padding: 4px 6px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }

        .btn-group { margin-top: 20px; display: flex; gap: 10px; }
        button { border: none; border-radius: 6px; font-family: inherit; font-size: 15px; font-weight: bold; cursor: pointer; padding: 14px; transition: 0.2s; }
        .btn-run { flex: 1; background: var(--primary); color: #ffffff; }
        .btn-run:hover { background: var(--primary-hover); }
        .btn-run:disabled { background: #bdc3c7; cursor: not-allowed; }
        .btn-clear { flex: 0.25; background: #7f8c8d; color: #ffffff; }
        .btn-clear:hover { background: #636e72; }

        /* 결과 다운로드 및 복사 컨트롤 */
        .result-section { margin-top: 30px; display: none; }
        .download-banner { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .btn-download { display: block; text-align: center; padding: 14px; background: var(--secondary); color: white; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 14px; }
        .btn-download:hover { background: var(--secondary-hover); }

        .tab-box { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 25px; background: #fff; }
        .tab-header { display: flex; justify-content: space-between; align-items: center; background: #2f3640; color: #fff; padding: 10px 15px; }
        .tab-title { font-weight: bold; font-size: 14px; }
        .btn-copy { background: #f39c12; color: white; padding: 6px 14px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; }
        .btn-copy:hover { background: #d68910; }

        .table-wrapper { max-height: 280px; overflow: auto; border-bottom: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
        th { background: #f1f2f6; position: sticky; top: 0; padding: 8px 10px; border-bottom: 2px solid var(--border); color: #333; }
        td { padding: 7px 10px; border-bottom: 1px solid #eee; white-space: nowrap; }
        tr:nth-child(even) { background-color: #f9f9f9; }

        textarea.tsv-area { width: 100%; height: 110px; border: none; padding: 10px; font-family: Consolas, monospace; font-size: 11px; background: #fafafa; color: #444; resize: vertical; box-sizing: border-box; }

        .log-box { margin-top: 20px; background: #2f3640; color: #f5f6fa; padding: 15px; font-family: Consolas, monospace; font-size: 12px; border-radius: 6px; height: 130px; overflow-y: auto; white-space: pre-wrap; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>물류 발주서 정규화 & 송장 압축 엔진</h1>
        <span class="badge" id="engineStatus">엔진 로딩 중...</span>
    </div>

    <input type="file" id="fileInput" multiple style="display: none;">
    <label for="fileInput" class="dropzone-label" id="dropArea">
        <p>📂 여기를 터치/클릭하여 발주서 파일 선택 (또는 드래그 앤 드롭)</p>
        <span>XLSX, XLS, CSV 지원 · 파일 수 무제한 일괄 인입 및 정규화</span>
    </label>

    <div class="file-box">
        <div class="file-summary">
            <span>대기 중인 발주서 (<span id="fileCount">0</span>개)</span>
        </div>
        <div class="file-list" id="fileListView">선택된 발주서 파일이 없습니다.</div>
    </div>

    <div class="btn-group">
        <button class="btn-run" id="btnExecute" disabled>⚡ 1·2번 프로세스 정제 연산 시작</button>
        <button class="btn-clear" id="btnClear" type="button">목록 비우기</button>
    </div>

    <!-- 연산 완료 후 노출 영역 -->
    <div class="result-section" id="resultSection">
        <div class="download-banner">
            <a href="#" class="btn-download" id="linkP1" download="1번_상품명_옵션분리형_마스터.xlsx">💾 1번 마스터 엑셀 다운로드</a>
            <a href="#" class="btn-download" id="linkP2" download="2번_1문서1행_택배송장등록용.xlsx">💾 2번 송장 엑셀 다운로드</a>
        </div>

        <!-- 1번 프로세스 테이블 & TSV -->
        <div class="tab-box">
            <div class="tab-header">
                <span class="tab-title">📋 [1번 프로세스] 상품명·옵션 분리형 마스터 (재고/출고 매칭용)</span>
                <button class="btn-copy" onclick="copyTSV('tsvP1', this)">TSV 복사</button>
            </div>
            <div class="table-wrapper" id="tableP1View"></div>
            <textarea class="tsv-area" id="tsvP1" readonly></textarea>
        </div>

        <!-- 2번 프로세스 테이블 & TSV -->
        <div class="tab-box">
            <div class="tab-header">
                <span class="tab-title">📦 [2번 프로세스] 1문서 1행 압축형 (택배 송장 등록용)</span>
                <button class="btn-copy" onclick="copyTSV('tsvP2', this)">TSV 복사</button>
            </div>
            <div class="table-wrapper" id="tableP2View"></div>
            <textarea class="tsv-area" id="tsvP2" readonly></textarea>
        </div>
    </div>

    <div class="log-box" id="logView">> 시스템 준비 완료. 발주서를 인입하십시오.</div>
</div>

<script>
    let loadedFiles = [];

    window.addEventListener('DOMContentLoaded', () => {
        const badge = document.getElementById('engineStatus');
        if (typeof XLSX !== 'undefined') {
            badge.innerText = "● 엑셀 엔진 정상 로드";
            log("엑셀 연산 엔진(SheetJS) 준비 완료.");
        } else {
            badge.innerText = "● 엑셀 엔진 로드 실패";
            badge.style.background = "#fdeed9";
            badge.style.color = "#e67e22";
            log("[경고] 인터넷 연결을 확인하십시오.");
        }
    });

    const PRODUCT_RULES = [
        { regex: /CDST01/i, name: "크로커다일 20D 슬림핏 팬티스타킹 5매 CDST01" },
        { regex: /CDST02/i, name: "크로커다일 30D 슬림핏 팬티스타킹 2매 CDST02" },
        { regex: /CDST03/i, name: "크로커다일 40D 슬림핏 팬티스타킹 2매 CDST03" },
        { regex: /CDST04/i, name: "크로커다일 40D 착압 힙업 팬티스타킹 1매 CDST04" },
        { regex: /CDST05/i, name: "크로커다일 80D 슬림핏 팬티스타킹 2매 CDST05" },
        { regex: /CDST09|골프\s*팬티스타킹/i, name: "크로커다일 30D UV차단 착압 올트임방지 골프 팬티스타킹 1매 CDST09" },
        { regex: /CDST10|종아리\s*압박밴드/i, name: "크로커다일 스포츠 발등 커버형 종아리 압박밴드 양쪽착용 세트 CDST10 1세트" },
        { regex: /CDST11|뒷꿈치풋패드/i, name: "크로커다일 프리미엄 스포츠 각질케어 뒷꿈치풋패드 2세트 CDST11" },
        { regex: /QU-SL02|종아리슬리브/i, name: "퀵실버 국내산 프리미엄 스포츠 종아리슬리브 압박보호대 1세트 QU-SL02" },
        { regex: /QU-MK01|쿨마스크/i, name: "퀵실버 국내산 UV자외선차단 AQUA냉감 쿨마스크 1개 QU-MK01" },
        { regex: /쿨토시/i, name: "퀵실버 국내산 UV자외선차단 심리스 AQUA 냉감 쿨토시 손등형" }
    ];

    const COLORS = ["스킨", "블랙", "화이트", "살구", "커피", "그레이", "차콜", "네이비", "베이지", "핑크"];
    const SIZES = ["FREE", "L/XL", "S/M", "M/L", "S", "M", "L", "XL"];

    function log(msg) {
        const box = document.getElementById("logView");
        box.innerText += "\n> " + msg;
        box.scrollTop = box.scrollHeight;
    }

    function cleanPhone(val) {
        if (!val) return "";
        let text = String(val).trim().replace(/^\+82/, "0");
        let digits = text.replace(/[^0-9]/g, "");
        if (digits.startsWith("82")) digits = "0" + digits.slice(2);

        if (digits.startsWith("02")) {
            return digits.length === 9 ? digits.replace(/(\d{2})(\d{3})(\d{4})/, "$1-$2-$3") : digits.replace(/(\d{2})(\d{4})(\d{4})/, "$1-$2-$3");
        } else if (digits.length === 11) {
            return digits.replace(/(\d{3})(\d{4})(\d{4})/, "$1-$2-$3");
        } else if (digits.length === 10) {
            return digits.replace(/(\d{3})(\d{3})(\d{4})/, "$1-$2-$3");
        }
        return text;
    }

    function cleanAddress(val) {
        if (!val) return "";
        return String(val).replace(/\(택배수령담당자\s*:?[\+0-9\s-]+\)/g, "").replace(/\s+/g, " ").trim();
    }

    function normalizeProduct(prod) {
        if (!prod) return "미지정 상품";
        const str = String(prod).trim();
        for (let rule of PRODUCT_RULES) {
            if (rule.regex.test(str)) return rule.name;
        }
        return str;
    }

    function normalizeOption(opt, prod) {
        const comb = `${opt || ""} ${prod || ""}`;
        let foundColor = COLORS.find(c => comb.includes(c)) || "스킨";
        let foundSize = SIZES.find(s => new RegExp(`\\b${s}\\b`, 'i').test(comb)) || "FREE";
        return `${foundColor} / ${foundSize}`;
    }

    // 파일 등록 리스너
    const fileInput = document.getElementById('fileInput');
    const dropArea = document.getElementById('dropArea');

    fileInput.addEventListener('change', function(e) {
        addFiles(this.files);
        this.value = '';
    });

    ['dragenter', 'dragover'].forEach(name => {
        dropArea.addEventListener(name, (e) => {
            e.preventDefault(); e.stopPropagation();
            dropArea.classList.add('dragover');
        });
    });

    ['dragleave', 'drop'].forEach(name => {
        dropArea.addEventListener(name, (e) => {
            e.preventDefault(); e.stopPropagation();
            dropArea.classList.remove('dragover');
        });
    });

    dropArea.addEventListener('drop', (e) => {
        if (e.dataTransfer && e.dataTransfer.files) {
            addFiles(e.dataTransfer.files);
        }
    });

    function addFiles(files) {
        if (!files || files.length === 0) return;
        let count = 0;
        Array.from(files).forEach(f => {
            if (!loadedFiles.some(cur => cur.name === f.name && cur.size === f.size)) {
                loadedFiles.push(f);
                count++;
            }
        });
        renderList();
        log(`${count}개 파일 등록 (총 ${loadedFiles.length}개)`);
    }

    function renderList() {
        const view = document.getElementById('fileListView');
        const countSpan = document.getElementById('fileCount');
        const btnRun = document.getElementById('btnExecute');

        countSpan.innerText = loadedFiles.length;

        if (loadedFiles.length === 0) {
            view.innerHTML = "선택된 발주서가 없습니다.";
            btnRun.disabled = true;
            return;
        }

        btnRun.disabled = false;
        view.innerHTML = loadedFiles.map((f, i) => `
            <div class="file-item">
                <span>[${i+1}] <b>${f.name}</b></span>
                <span style="color: #888;">${(f.size/1024).toFixed(1)} KB</span>
            </div>
        `).join("");
    }

    document.getElementById('btnClear').addEventListener('click', () => {
        loadedFiles = [];
        renderList();
        document.getElementById('resultSection').style.display = "none";
        log("파일 목록을 비웠습니다.");
    });

    // 다중 행 가중치 스캔 + 내용 분석 파서
    async function parseWorkbook(file) {
        const buffer = await file.arrayBuffer();
        let workbook;
        const ext = file.name.split('.').pop().toLowerCase();

        if (ext === 'csv') {
            let text = new TextDecoder('euc-kr').decode(buffer);
            if (text.includes('')) text = new TextDecoder('utf-8').decode(buffer);
            workbook = XLSX.read(text, { type: 'string' });
        } else {
            workbook = XLSX.read(new Uint8Array(buffer), { type: 'array' });
        }

        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rawMatrix = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
        if (!rawMatrix || rawMatrix.length === 0) return null;

        // 최대 열 길이 측정
        let maxCols = 0;
        rawMatrix.forEach(r => { if (r && r.length > maxCols) maxCols = r.length; });

        // 1. 헤더 행 탐색 (가중치 스코어링 방식)
        const HEADER_PATTERNS = {
            center: /물류센터|입고센터|입고지|배송지명|센터명|납품처|도착지|배송센터/i,
            orderNo: /발주번호|발주서번호|발주서No|주문번호|PO번호|발주ID/i,
            phone: /전화번호|수취인전화|택배수령담당자|연락처|휴대폰|수령인연락처|센터연락처/i,
            addr: /주소|배송지주소|수취인주소|납품지주소|센터주소|물류센터주소/i,
            prod: /상품명|등록상품명|발주상품명|노출상품명|품목명|품명|매입상품명/i,
            opt: /옵션명|등록옵션명|옵션|품목상세|옵션정보/i,
            qty: /발주수량|수량|입고예정수량|주문수량/i
        };

        let bestHeaderRowIdx = -1;
        let maxScore = 0;

        for (let r = 0; r < Math.min(rawMatrix.length, 20); r++) {
            const row = rawMatrix[r];
            if (!row || row.length < 2) continue;
            let score = 0;
            let matchedKeys = new Set();

            for (let c = 0; c < row.length; c++) {
                const val = String(row[c] || "").replace(/[\s\r\n]+/g, "");
                if (!val) continue;
                for (let [key, pat] of Object.entries(HEADER_PATTERNS)) {
                    if (pat.test(val) && !matchedKeys.has(key)) {
                        score += 15;
                        matchedKeys.add(key);
                    }
                }
            }
            const nonEmpty = row.filter(c => String(c || "").trim() !== "").length;
            if (nonEmpty >= 4 && score >= 15) score += nonEmpty;

            if (score > maxScore) {
                maxScore = score;
                bestHeaderRowIdx = r;
            }
        }

        // 헤더 매칭이 부족하면 데이터 내용으로 탐색
        let headerRow = [];
        let dataRows = [];
        if (bestHeaderRowIdx !== -1 && maxScore >= 15) {
            headerRow = rawMatrix[bestHeaderRowIdx];
            dataRows = rawMatrix.slice(bestHeaderRowIdx + 1).filter(r => r.some(c => String(c).trim() !== ""));
        } else {
            dataRows = rawMatrix.filter(r => r.some(c => String(c).trim() !== ""));
        }

        let colCenter = -1, colNo = -1, colPhone = -1, colAddr = -1, colProd = -1, colOpt = -1, colQty = -1;

        // 헤더 텍스트 매핑
        headerRow.forEach((h, idx) => {
            const clean = String(h).replace(/[\s\r\n]+/g, "");
            if (colCenter === -1 && HEADER_PATTERNS.center.test(clean)) colCenter = idx;
            if (colNo === -1 && HEADER_PATTERNS.orderNo.test(clean)) colNo = idx;
            if (colPhone === -1 && HEADER_PATTERNS.phone.test(clean)) colPhone = idx;
            if (colAddr === -1 && HEADER_PATTERNS.addr.test(clean)) colAddr = idx;
            if (colProd === -1 && HEADER_PATTERNS.prod.test(clean)) colProd = idx;
            if (colOpt === -1 && HEADER_PATTERNS.opt.test(clean)) colOpt = idx;
            if (colQty === -1 && HEADER_PATTERNS.qty.test(clean)) colQty = idx;
        });

        // 2. 내용 패턴 기반 보정 (전화번호, 주소, 상품명, 수량 자동 감지)
        if (dataRows.length > 0) {
            const sample = dataRows.slice(0, 15);
            for (let c = 0; c < maxCols; c++) {
                const vals = sample.map(r => String(r[c] || "").trim());
                const joined = vals.join(" ");

                if (colPhone === -1 && /(?:\+82|010|070|02)[-\s]?\d{3,4}[-\s]?\d{4}/.test(joined)) {
                    colPhone = c;
                }
                if (colAddr === -1 && (joined.includes("시 ") || joined.includes("구 ") || joined.includes("로 ") || joined.includes("길 ") || joined.includes("택배수령담당자"))) {
                    colAddr = c;
                }
                if (colProd === -1 && /CDST|QU-|크로커다일|스타킹|쿨토시|마스크|슬리브/i.test(joined)) {
                    colProd = c;
                }
                if (colOpt === -1 && (joined.includes("스킨") || joined.includes("블랙") || joined.includes("FREE") || joined.includes("L/XL"))) {
                    colOpt = c;
                }
                if (colCenter === -1 && /인천|창원|동탄|고양|대구|덕평|안성|호법|센터|FC/i.test(joined)) {
                    colCenter = c;
                }
                if (colQty === -1 && vals.filter(v => v !== "").length > 0 && vals.every(v => !v || /^\d+$/.test(v))) {
                    colQty = c;
                }
            }
        }

        // 3. 물류센터명 추출 (컬럼 -> 파일명 폴백)
        let centerRaw = "";
        if (colCenter !== -1) {
            for (let r of dataRows) {
                if (r[colCenter] && String(r[colCenter]).trim()) {
                    centerRaw = String(r[colCenter]).trim();
                    break;
                }
            }
        }
        if (!centerRaw) {
            const fnMatch = file.name.match(/(인천\d*|창원\d*|동탄\d*|고양\d*|대구\d*|덕평\d*|안성\d*|호법\d*|용인\d*|화성\d*|목천\d*|이천\d*|칠곡\d*|김해\d*|[가-힣]+센터|[가-힣]+FC)/i);
            centerRaw = fnMatch ? fnMatch[0] : "미지정센터";
        }

        // 4. 발주번호 추출 (컬럼 -> 파일명 폴백)
        let orderNo = "";
        if (colNo !== -1) {
            for (let r of dataRows) {
                if (r[colNo] && String(r[colNo]).trim()) {
                    orderNo = String(r[colNo]).trim();
                    break;
                }
            }
        }
        if (!orderNo) {
            const numMatch = file.name.match(/\d{7,}/);
            orderNo = numMatch ? numMatch[0] : file.name.replace(/\.[^/.]+$/, "");
        }

        return {
            file, dataRows, orderNo, centerRaw,
            mapping: { colCenter, colPhone, colAddr, colProd, colOpt, colQty }
        };
    }

    // 메인 변환 연산
    document.getElementById('btnExecute').addEventListener('click', async () => {
        if (loadedFiles.length === 0) return;
        const btn = document.getElementById('btnExecute');
        btn.disabled = true;
        btn.innerText = "데이터 정제 연산 진행 중...";

        try {
            log(">>> [단계 1] 전체 발주서 파싱 및 센터 식별자 산출...");
            const fileRecords = [];

            for (let file of loadedFiles) {
                const res = await parseWorkbook(file);
                if (!res || res.dataRows.length === 0) {
                    log(`[경고] 유효 데이터 없음: ${file.name}`);
                    continue;
                }
                fileRecords.push(res);
                log(`- ${file.name} -> 센터: [${res.centerRaw}], 발주No: [${res.orderNo}], 품목수: ${res.dataRows.length}`);
            }

            // 글로벌 센터 중복 식별자 부여 (-1, -2 접미사)
            const centerCounts = {};
            fileRecords.forEach(r => centerCounts[r.centerRaw] = (centerCounts[r.centerRaw] || 0) + 1);

            const centerRunningIdx = {};
            fileRecords.forEach(r => {
                if (centerCounts[r.centerRaw] > 1) {
                    const idx = centerRunningIdx[r.centerRaw] || 1;
                    r.centerId = `${r.centerRaw}-${idx}`;
                    centerRunningIdx[r.centerRaw] = idx + 1;
                } else {
                    r.centerId = r.centerRaw;
                }
            });

            log(">>> [단계 2] 1번 마스터 및 2번 송장 압축 데이터 연산...");
            const p1Data = [];
            const p2Data = [];

            for (let rec of fileRecords) {
                const { colPhone, colAddr, colProd, colOpt, colQty } = rec.mapping;
                
                let phoneRaw = "";
                let addrRaw = "";
                if (colPhone !== -1) {
                    const found = rec.dataRows.find(r => r[colPhone] && String(r[colPhone]).trim() !== "");
                    if (found) phoneRaw = found[colPhone];
                }
                if (colAddr !== -1) {
                    const found = rec.dataRows.find(r => r[colAddr] && String(r[colAddr]).trim() !== "");
                    if (found) addrRaw = found[colAddr];
                }

                const cleanP = cleanPhone(phoneRaw);
                const cleanA = cleanAddress(addrRaw);

                let docTotalQty = 0;

                rec.dataRows.forEach(row => {
                    const pVal = colProd !== -1 ? row[colProd] : "";
                    const oVal = colOpt !== -1 ? row[colOpt] : "";
                    
                    let qVal = 1;
                    if (colQty !== -1) {
                        const parsed = parseInt(row[colQty]);
                        if (!isNaN(parsed)) qVal = parsed;
                    }

                    if (!pVal && !oVal) return;
                    docTotalQty += qVal;

                    p1Data.push({
                        "물류센터": rec.centerId,
                        "택배수령담당자": cleanP,
                        "주소": cleanA,
                        "상품명": normalizeProduct(pVal),
                        "옵션": normalizeOption(oVal, pVal),
                        "발주수량": qVal
                    });
                });

                p2Data.push({
                    "발주서 No.": rec.orderNo,
                    "물류센터": rec.centerId,
                    "택배수령담당자": cleanP,
                    "주소": cleanA,
                    "발주수량": docTotalQty
                });
            }

            // 1번 및 2번 프로세스 테이블 렌더링 & TSV 생성
            renderTable('tableP1View', p1Data, ["물류센터", "택배수령담당자", "주소", "상품명", "옵션", "발주수량"]);
            renderTable('tableP2View', p2Data, ["발주서 No.", "물류센터", "택배수령담당자", "주소", "발주수량"]);

            document.getElementById('tsvP1').value = generateTSV(p1Data, ["물류센터", "택배수령담당자", "주소", "상품명", "옵션", "발주수량"]);
            document.getElementById('tsvP2').value = generateTSV(p2Data, ["발주서 No.", "물류센터", "택배수령담당자", "주소", "발주수량"]);

            // 엑셀 Blob 다운로드 링크 생성
            const wb1 = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb1, XLSX.utils.json_to_sheet(p1Data), "마스터");
            const blob1 = new Blob([XLSX.write(wb1, { bookType: 'xlsx', type: 'array' })], { type: "application/octet-stream" });

            const wb2 = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb2, XLSX.utils.json_to_sheet(p2Data), "송장압축");
            const blob2 = new Blob([XLSX.write(wb2, { bookType: 'xlsx', type: 'array' })], { type: "application/octet-stream" });

            document.getElementById('linkP1').href = URL.createObjectURL(blob1);
            document.getElementById('linkP2').href = URL.createObjectURL(blob2);
            document.getElementById('resultSection').style.display = "block";

            // 자동 다운로드 트리거
            XLSX.writeFile(wb1, "1번_상품명_옵션분리형_마스터.xlsx");
            setTimeout(() => XLSX.writeFile(wb2, "2번_1문서1행_택배송장등록용.xlsx"), 600);

            log(`>>> [완료] ${fileRecords.length}개 발주서 연산 완료! (1번: ${p1Data.length}행, 2번: ${p2Data.length}행)`);
        } catch (err) {
            log("[오류] " + err.message);
            alert("처리 중 에러 발생: " + err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "⚡ 1·2번 프로세스 정제 연산 시작";
        }
    });

    function renderTable(containerId, data, cols) {
        const wrap = document.getElementById(containerId);
        let html = '<table><thead><tr>' + cols.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';
        data.forEach(r => {
            html += '<tr>' + cols.map(c => `<td>${r[c] !== undefined ? r[c] : ''}</td>`).join('') + '</tr>';
        });
        html += '</tbody></table>';
        wrap.innerHTML = html;
    }

    function generateTSV(data, cols) {
        let tsv = cols.join('\t') + '\n';
        data.forEach(r => {
            tsv += cols.map(c => r[c] !== undefined ? r[c] : '').join('\t') + '\n';
        });
        return tsv.trim();
    }

    function copyTSV(areaId, btn) {
        const area = document.getElementById(areaId);
        area.select();
        navigator.clipboard.writeText(area.value).then(() => {
            const org = btn.innerText;
            btn.innerText = "복사 완료!";
            btn.style.background = "#27ae60";
            setTimeout(() => {
                btn.innerText = org;
                btn.style.background = "#f39c12";
            }, 1500);
        });
    }
</script>
