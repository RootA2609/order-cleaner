<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>물류 발주서 정규화 & 송장 압축 엔진</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; background-color: #f1f4f8; margin: 0; padding: 25px; color: #2c3e50; }
        .container { max-width: 860px; margin: 0 auto; background: #ffffff; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.07); padding: 30px; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #27ae60; padding-bottom: 12px; margin-bottom: 20px; }
        .header-bar h2 { margin: 0; font-size: 20px; color: #1a252f; }
        .badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: bold; background: #e8f8f5; color: #27ae60; }

        .dropzone-label {
            display: block;
            width: 100%;
            padding: 35px 20px;
            border: 2px dashed #3498db;
            border-radius: 10px;
            background: #f8fbfe;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        .dropzone-label:hover { background: #eaf4fd; border-color: #27ae60; }
        .dropzone-label.dragover { background: #d5e8f8; border-color: #27ae60; border-style: solid; }
        .dropzone-label p { margin: 0 0 6px 0; font-size: 16px; font-weight: bold; color: #2980b9; }
        .dropzone-label span { font-size: 13px; color: #7f8c8d; }

        .file-box { margin-top: 15px; border: 1px solid #dcdde1; border-radius: 8px; padding: 12px; background: #fafafa; }
        .file-summary { font-size: 13px; font-weight: bold; margin-bottom: 8px; color: #34495e; display: flex; justify-content: space-between; }
        .file-list { max-height: 160px; overflow-y: auto; font-size: 12px; font-family: Consolas, monospace; line-height: 1.6; }
        .file-item { padding: 4px 6px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }

        .btn-group { margin-top: 20px; display: flex; gap: 10px; }
        button { border: none; border-radius: 6px; font-family: inherit; font-size: 15px; font-weight: bold; cursor: pointer; padding: 14px; transition: 0.2s; }
        .btn-run { flex: 1; background: #27ae60; color: #ffffff; }
        .btn-run:hover { background: #219150; }
        .btn-run:disabled { background: #bdc3c7; cursor: not-allowed; }
        .btn-clear { flex: 0.25; background: #7f8c8d; color: #ffffff; }
        .btn-clear:hover { background: #636e72; }

        .download-links { margin-top: 15px; display: none; gap: 10px; }
        .download-btn { flex: 1; text-align: center; padding: 12px; background: #2980b9; color: white; text-decoration: none; border-radius: 6px; font-size: 13px; font-weight: bold; }
        .download-btn:hover { background: #1c5980; }

        .log-box { margin-top: 20px; background: #2f3640; color: #f5f6fa; padding: 15px; font-family: Consolas, monospace; font-size: 12px; border-radius: 6px; height: 130px; overflow-y: auto; white-space: pre-wrap; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h2>물류 발주서 정규화 & 송장 압축 엔진</h2>
        <span class="badge" id="engineStatus">엔진 로딩 중...</span>
    </div>

    <input type="file" id="fileInput" multiple style="display: none;">
    <label for="fileInput" class="dropzone-label" id="dropArea">
        <p>📂 여기를 클릭하여 발주서 파일 선택 (또는 드래그 앤 드롭)</p>
        <span>크롬/엣지 완벽 지원 · 파일 수 무제한 (9개, 50개, 100개 일괄 등록 가능)</span>
    </label>

    <div class="file-box">
        <div class="file-summary">
            <span>인입 완료된 발주서 (<span id="fileCount">0</span>개)</span>
        </div>
        <div class="file-list" id="fileListView">선택된 발주서가 없습니다.</div>
    </div>

    <div class="btn-group">
        <button class="btn-run" id="btnExecute" disabled>⚡ 1·2번 프로세스 정제 및 연산 시작</button>
        <button class="btn-clear" id="btnClear" type="button">목록 비우기</button>
    </div>

    <div class="download-links" id="downloadLinks">
        <a href="#" class="download-btn" id="linkP1" download="1번_상품명_옵션분리형_마스터.xlsx">💾 1번 마스터 엑셀 다운로드</a>
        <a href="#" class="download-btn" id="linkP2" download="2번_1문서1행_택배송장등록용.xlsx">💾 2번 송장용 엑셀 다운로드</a>
    </div>

    <div class="log-box" id="logView">> 시스템 초기화 완료.</div>
</div>

<script>
    let loadedFiles = [];

    window.addEventListener('DOMContentLoaded', () => {
        const badge = document.getElementById('engineStatus');
        if (typeof XLSX !== 'undefined') {
            badge.innerText = "● 엑셀 엔진 정상 로드";
            log("엑셀 연산 엔진(SheetJS) 준비 완료.");
        } else {
            badge.innerText = "● 엑셀 엔진 로드 실패";
            badge.style.background = "#fdeed9";
            badge.style.color = "#e67e22";
            log("[경고] 인터넷 연결 상태를 확인하십시오.");
        }
    });

    const PRODUCT_RULES = [
        { regex: /CDST01/i, name: "크로커다일 20D 슬림핏 팬티스타킹 5매 CDST01" },
        { regex: /CDST02/i, name: "크로커다일 30D 슬림핏 팬티스타킹 2매 CDST02" },
        { regex: /CDST03/i, name: "크로커다일 40D 슬림핏 팬티스타킹 2매 CDST03" },
        { regex: /CDST04/i, name: "크로커다일 40D 착압 힙업 팬티스타킹 1매 CDST04" },
        { regex: /CDST05/i, name: "크로커다일 80D 슬림핏 팬티스타킹 2매 CDST05" },
        { regex: /CDST09|골프\s*팬티스타킹/i, name: "크로커다일 30D UV차단 착압 올트임방지 골프 팬티스타킹 1매 CDST09" },
        { regex: /CDST10|종아리\s*압박밴드/i, name: "크로커다일 스포츠 발등 커버형 종아리 압박밴드 양쪽착용 세트 CDST10 1세트" },
        { regex: /CDST11|뒷꿈치풋패드/i, name: "크로커다일 프리미엄 스포츠 각질케어 뒷꿈치풋패드 2세트 CDST11" },
        { regex: /QU-SL02|종아리슬리브/i, name: "퀵실버 국내산 프리미엄 스포츠 종아리슬리브 압박보호대 1세트 QU-SL02" },
        { regex: /QU-MK01|쿨마스크/i, name: "퀵실버 국내산 UV자외선차단 AQUA냉감 쿨마스크 1개 QU-MK01" },
        { regex: /쿨토시/i, name: "퀵실버 국내산 UV자외선차단 심리스 AQUA 냉감 쿨토시 손등형" }
    ];

    const COLORS = ["스킨", "블랙", "화이트", "살구", "커피", "그레이", "차콜", "네이비", "베이지", "핑크"];
    const SIZES = ["FREE", "L/XL", "S/M", "M/L", "S", "M", "L", "XL"];

    function log(msg) {
        const box = document.getElementById("logView");
        box.innerText += "\n> " + msg;
        box.scrollTop = box.scrollHeight;
    }

    function cleanPhone(val) {
        if (!val) return "";
        let text = String(val).trim().replace(/^\+82/, "0");
        let digits = text.replace(/[^0-9]/g, "");
        if (digits.startsWith("82")) digits = "0" + digits.slice(2);

        if (digits.startsWith("02")) {
            return digits.length === 9 ? digits.replace(/(\d{2})(\d{3})(\d{4})/, "$1-$2-$3") : digits.replace(/(\d{2})(\d{4})(\d{4})/, "$1-$2-$3");
        } else if (digits.length === 11) {
            return digits.replace(/(\d{3})(\d{4})(\d{4})/, "$1-$2-$3");
        } else if (digits.length === 10) {
            return digits.replace(/(\d{3})(\d{3})(\d{4})/, "$1-$2-$3");
        }
        return text;
    }

    function cleanAddress(val) {
        if (!val) return "";
        return String(val).replace(/\(택배수령담당자\s*:?[\+0-9\s-]+\)/g, "").replace(/\s+/g, " ").trim();
    }

    function normalizeProduct(prod) {
        if (!prod) return "미지정 상품";
        const str = String(prod);
        for (let rule of PRODUCT_RULES) {
            if (rule.regex.test(str)) return rule.name;
        }
        return str.trim();
    }

    function normalizeOption(opt, prod) {
        const comb = `${opt || ""} ${prod || ""}`;
        let foundColor = COLORS.find(c => comb.includes(c)) || "스킨";
        let foundSize = SIZES.find(s => new RegExp(`\\b${s}\\b`, 'i').test(comb)) || "FREE";
        return `${foundColor} / ${foundSize}`;
    }

    const fileInput = document.getElementById('fileInput');
    const dropArea = document.getElementById('dropArea');

    fileInput.addEventListener('change', function(e) {
        addFiles(this.files);
        this.value = '';
    });

    ['dragenter', 'dragover'].forEach(name => {
        dropArea.addEventListener(name, (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropArea.classList.add('dragover');
        });
    });

    ['dragleave', 'drop'].forEach(name => {
        dropArea.addEventListener(name, (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropArea.classList.remove('dragover');
        });
    });

    dropArea.addEventListener('drop', (e) => {
        if (e.dataTransfer && e.dataTransfer.files) {
            addFiles(e.dataTransfer.files);
        }
    });

    function addFiles(files) {
        if (!files || files.length === 0) return;
        let count = 0;
        Array.from(files).forEach(f => {
            if (!loadedFiles.some(cur => cur.name === f.name && cur.size === f.size)) {
                loadedFiles.push(f);
                count++;
            }
        });
        renderList();
        log(`${count}개 파일 등록 (총 ${loadedFiles.length}개)`);
    }

    function renderList() {
        const view = document.getElementById('fileListView');
        const countSpan = document.getElementById('fileCount');
        const btnRun = document.getElementById('btnExecute');

        countSpan.innerText = loadedFiles.length;

        if (loadedFiles.length === 0) {
            view.innerHTML = "선택된 발주서가 없습니다.";
            btnRun.disabled = true;
            return;
        }

        btnRun.disabled = false;
        view.innerHTML = loadedFiles.map((f, i) => `
            <div class="file-item">
                <span>[${i+1}] <b>${f.name}</b></span>
                <span style="color: #888;">${(f.size/1024).toFixed(1)} KB</span>
            </div>
        `).join("");
    }

    document.getElementById('btnClear').addEventListener('click', () => {
        loadedFiles = [];
        renderList();
        document.getElementById('downloadLinks').style.display = "none";
        log("파일 목록을 비웠습니다.");
    });

    async function parseWorkbook(file) {
        const buffer = await file.arrayBuffer();
        let workbook;
        const ext = file.name.split('.').pop().toLowerCase();

        if (ext === 'csv') {
            let text = new TextDecoder('euc-kr').decode(buffer);
            if (text.includes('')) {
                text = new TextDecoder('utf-8').decode(buffer);
            }
            workbook = XLSX.read(text, { type: 'string' });
        } else {
            workbook = XLSX.read(new Uint8Array(buffer), { type: 'array' });
        }

        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
        if (!rows || rows.length === 0) return { headers: [], data: [] };

        let headerRowIdx = 0;
        const targetKeywords = ["물류센터", "입고지", "배송지", "상품명", "수량", "주소", "수령인", "받는분"];
        for (let i = 0; i < Math.min(rows.length, 10); i++) {
            const rowStr = rows[i].map(c => String(c).replace(/\s+/g, '')).join(' ');
            const hits = targetKeywords.filter(k => rowStr.includes(k)).length;
            if (hits >= 2) {
                headerRowIdx = i;
                break;
            }
        }

        const headers = rows[headerRowIdx].map(h => String(h).trim());
        const dataRows = rows.slice(headerRowIdx + 1).filter(r => r.some(c => String(c).trim() !== ""));

        const jsonData = dataRows.map(r => {
            const obj = {};
            headers.forEach((h, idx) => {
                if (h) obj[h] = r[idx] !== undefined ? r[idx] : "";
            });
            return obj;
        });

        return { headers, data: jsonData };
    }

    function findCol(headers, candidates) {
        return headers.find(h => {
            const clean = String(h).replace(/\s+/g, "");
            return candidates.some(c => clean.includes(c));
        });
    }

    document.getElementById('btnExecute').addEventListener('click', async () => {
        if (loadedFiles.length === 0) return;
        const btn = document.getElementById('btnExecute');
        btn.disabled = true;
        btn.innerText = "데이터 정제 연산 진행 중...";

        try {
            log(">>> [단계 1] 전체 발주서 스캔 및 센터 중복 식별자 부여...");
            const fileRecords = [];

            for (let file of loadedFiles) {
                const { headers, data } = await parseWorkbook(file);
                if (data.length === 0) continue;

                const colCenter = findCol(headers, ["물류센터", "입고지", "배송지명", "센터명", "납품처"]);
                const centerVal = (colCenter && data[0]) ? String(data[0][colCenter]).trim() : "미지정센터";

                const colNo = findCol(headers, ["발주번호", "발주서번호", "발주서No", "주문번호", "발주코드"]);
                let orderNo = (colNo && data[0]) ? String(data[0][colNo]).trim() : "";
                if (!orderNo) {
                    const match = file.name.match(/\d{7,}/);
                    orderNo = match ? match[0] : file.name.replace(/\.[^/.]+$/, "");
                }

                fileRecords.push({ file, headers, data, centerRaw: centerVal, orderNo });
            }

            const centerCounts = {};
            fileRecords.forEach(r => centerCounts[r.centerRaw] = (centerCounts[r.centerRaw] || 0) + 1);

            const centerRunningIdx = {};
            fileRecords.forEach(r => {
                if (centerCounts[r.centerRaw] > 1) {
                    const idx = centerRunningIdx[r.centerRaw] || 1;
                    r.centerId = `${r.centerRaw}-${idx}`;
                    centerRunningIdx[r.centerRaw] = idx + 1;
                } else {
                    r.centerId = r.centerRaw;
                }
            });

            log(">>> [단계 2] 1번 마스터 및 2번 송장 압축 데이터 연산...");
            const p1Data = [];
            const p2Data = [];

            for (let rec of fileRecords) {
                const colPhone = findCol(rec.headers, ["전화번호", "수취인전화", "택배수령담당자", "연락처", "휴대폰"]);
                const colAddr = findCol(rec.headers, ["주소", "배송지주소", "수취인주소", "납품지주소"]);
                const colProd = findCol(rec.headers, ["등록상품명", "발주상품명", "상품명", "노출상품명"]);
                const colOpt = findCol(rec.headers, ["등록옵션명", "옵션명", "옵션"]);
                const colQty = findCol(rec.headers, ["발주수량", "수량", "입고예정수량"]);

                const phoneRaw = (colPhone && rec.data[0]) ? rec.data[0][colPhone] : "";
                const addrRaw = (colAddr && rec.data[0]) ? rec.data[0][colAddr] : "";

                const cleanP = cleanPhone(phoneRaw);
                const cleanA = cleanAddress(addrRaw);

                let docTotalQty = 0;

                rec.data.forEach(row => {
                    const pVal = colProd ? row[colProd] : "";
                    const oVal = colOpt ? row[colOpt] : "";
                    const qVal = parseInt(colQty ? row[colQty] : 1) || 1;

                    docTotalQty += qVal;

                    p1Data.push({
                        "물류센터": rec.centerId,
                        "택배수령담당자": cleanP,
                        "주소": cleanA,
                        "상품명": normalizeProduct(pVal),
                        "옵션": normalizeOption(oVal, pVal),
                        "발주수량": qVal
                    });
                });

                p2Data.push({
                    "발주서 No.": rec.orderNo,
                    "물류센터": rec.centerId,
                    "택배수령담당자": cleanP,
                    "주소": cleanA,
                    "발주수량": docTotalQty
                });
            }

            const wb1 = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb1, XLSX.utils.json_to_sheet(p1Data), "마스터");
            const wb1Out = XLSX.write(wb1, { bookType: 'xlsx', type: 'array' });
            const blob1 = new Blob([wb1Out], { type: "application/octet-stream" });

            const wb2 = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb2, XLSX.utils.json_to_sheet(p2Data), "송장압축");
            const wb2Out = XLSX.write(wb2, { bookType: 'xlsx', type: 'array' });
            const blob2 = new Blob([wb2Out], { type: "application/octet-stream" });

            const linkP1 = document.getElementById('linkP1');
            const linkP2 = document.getElementById('linkP2');
            linkP1.href = URL.createObjectURL(blob1);
            linkP2.href = URL.createObjectURL(blob2);
            document.getElementById('downloadLinks').style.display = "flex";

            XLSX.writeFile(wb1, "1번_상품명_옵션분리형_마스터.xlsx");
            setTimeout(() => {
                XLSX.writeFile(wb2, "2번_1문서1행_택배송장등록용.xlsx");
            }, 600);

            log(`>>> [완료] ${fileRecords.length}개 발주서 처리 완료. 엑셀 다운로드 시작.`);
        } catch (err) {
            log("[오류] " + err.message);
            alert("정제 중 오류 발생: " + err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "⚡ 1·2번 프로세스 정제 및 연산 시작";
        }
    });
</script>

</body>
</html>
